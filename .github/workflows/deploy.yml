# =============================================================================
# 4XL Edge - GitHub Actions CI/CD
# =============================================================================

name: 4XL Edge Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Frontend Checks & Build
  # -------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  # -------------------------------------------------------------
  # Backend Checks
  # -------------------------------------------------------------
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Test backend imports
        working-directory: backend
        run: python -c "import app; print('Backend loaded successfully')"

  # -------------------------------------------------------------
  # Native Windows App Build
  # -------------------------------------------------------------
  build-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build WinUI 3 App (ARM64)
        working-directory: native/4xl-edge
        run: dotnet build -c Release -r win-arm64
      - name: Build WinUI 3 App (x64)
        working-directory: native/4xl-edge
        run: dotnet build -c Release -r win-x64

  # -------------------------------------------------------------
  # Deploy to HuggingFace (Legacy Web Demo)
  # -------------------------------------------------------------
  deploy-hf:
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Skipping HF deploy: no token"; exit 0; fi
          git clone https://mahinigam:$HF_TOKEN@huggingface.co/spaces/mahinigam/4xl-api /tmp/hf-backend
          rsync -av --delete --exclude '.git' backend/ /tmp/hf-backend/
          cd /tmp/hf-backend
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "deploy: backend update"
            git push
          fi
      - name: Deploy Frontend to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Skipping HF deploy: no token"; exit 0; fi
          git clone https://mahinigam:$HF_TOKEN@huggingface.co/spaces/mahinigam/4xl /tmp/hf-frontend
          rsync -av --delete --exclude '.git' --exclude 'node_modules' --exclude 'dist' frontend/ /tmp/hf-frontend/
          cd /tmp/hf-frontend
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git add -A
            git commit -m "deploy: frontend update"
            git push
          fi
